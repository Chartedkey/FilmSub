name: Сборка FilmSub.exe

# Сборка запускается при каждом изменении в main.
# Если номер версии в filmsub/__init__.py новый — публикуется релиз vX.Y.Z с FilmSub.exe.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Определить версию
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('filmsub/__init__.py', encoding='utf-8').read()).group(1))")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "Версия $VER уже опубликована — только проверочная сборка"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "Новая версия $VER — будет опубликован релиз"
          fi

      # Загрузчик PyInstaller собирается из исходников прямо здесь: готовый загрузчик из PyPI
      # одинаков у тысяч программ (в том числе вредоносных), и антивирусы реагируют на него.
      - name: Установить PyInstaller (со сборкой загрузчика) и numpy
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install --no-binary pyinstaller --no-cache-dir pyinstaller
          python -m pip install numpy

      - name: Сведения о версии для exe
        run: python tools/make_version_info.py version_info.txt

      - name: Проверить, что код компилируется
        run: python -m compileall -q filmsub FilmSub.pyw

      - name: Собрать FilmSub.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name FilmSub
          --icon filmsub.ico --version-file version_info.txt
          --add-data "filmsub.ico;." --add-data "filmsub/data;filmsub/data"
          --hidden-import numpy --exclude-module numpy.tests FilmSub.pyw

      - name: Проверить сборку
        shell: bash
        run: |
          ls -la dist
          sha256sum dist/FilmSub.exe | tee dist/FilmSub.exe.sha256

      - name: Сохранить сборку
        uses: actions/upload-artifact@v4
        with:
          name: FilmSub-${{ steps.ver.outputs.version }}
          path: dist/FilmSub.exe

      - name: Опубликовать релиз
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FilmSub ${{ steps.ver.outputs.version }}
          files: |
            dist/FilmSub.exe
            dist/FilmSub.exe.sha256
          generate_release_notes: true
