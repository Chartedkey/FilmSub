name: Сборка FilmSub.exe

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Проверить, что код компилируется
        run: python -m compileall -q filmsub FilmSub.pyw

      - name: Собрать FilmSub.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name FilmSub
          --icon filmsub.ico --add-data "filmsub.ico;." FilmSub.pyw

      - name: Сохранить сборку
        uses: actions/upload-artifact@v4
        with:
          name: FilmSub
          path: dist/FilmSub.exe

      - name: Опубликовать релиз
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FilmSub.exe
